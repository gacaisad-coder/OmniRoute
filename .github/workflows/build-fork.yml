name: Build Fork Docker Image (GHCR)

on:
  push:
    branches:
      - main
      - 'build/**'
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        type: string
        default: ""
      version:
        description: "Docker image version tag (e.g. 3.8.48). Defaults to branch/tag name."
        required: false
        type: string
        default: ""
      promote_latest:
        description: "Also tag as :latest"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GHCR_IMAGE_NAME: ghcr.io/gacaisad-coder/omniroute

jobs:
  prepare:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      promote_latest: ${{ steps.meta.outputs.promote_latest }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - name: Resolve version and ref
        id: meta
        run: |
          set -euo pipefail

          # Determine checkout ref
          if [ -n "${{ inputs.ref }}" ]; then
            CHECKOUT_REF="${{ inputs.ref }}"
          else
            CHECKOUT_REF="${{ github.ref }}"
          fi
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

          # Determine version tag
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Use branch name, sanitized
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION//\//-}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Latest promotion
          PROMOTE="${{ inputs.promote_latest }}"
          echo "promote_latest=${PROMOTE:-false}" >> "$GITHUB_OUTPUT"

          echo "Will build ref=$CHECKOUT_REF as version=$VERSION (promote_latest=${PROMOTE:-false})"

  build:
    name: Build Docker (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Export digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/base
          touch "/tmp/digests/base/${DIGEST#sha256:}"

      - name: Upload base digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/base/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-base-*
          path: /tmp/digests/base
          merge-multiple: true

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          TAGS=(-t "${GHCR_IMAGE_NAME}:${VERSION}")
          if [ "$PROMOTE_LATEST" = "true" ]; then
            TAGS+=(-t "${GHCR_IMAGE_NAME}:latest")
          fi
          REFS=()
          while IFS= read -r digest_file; do
            REFS+=("${GHCR_IMAGE_NAME}@sha256:$(basename "$digest_file")")
          done < <(find /tmp/digests/base -type f | sort)
          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "No image digests found" >&2
            exit 1
          fi
          echo "Creating manifest for ${GHCR_IMAGE_NAME}:${VERSION} with ${#REFS[@]} platform(s)..."
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE_NAME}:${VERSION}"
