name: Build v3.8.48 ARM Docker Image (Native)

on:
  push:
    branches:
      - "build/v3.8.48-arm"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/gacaisad-coder/omniroute
  VERSION: "3.8.48"

jobs:
  build:
    name: Build and Push ARM64 Image (Native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=omniroute
            org.opencontainers.image.description=OmniRoute v3.8.48 — Unified AI proxy/router
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.url=https://github.com/gacaisad-coder/OmniRoute
            org.opencontainers.image.source=https://github.com/gacaisad-coder/OmniRoute
            org.opencontainers.image.licenses=MIT

      - name: Build and push ARM64 image (native)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
